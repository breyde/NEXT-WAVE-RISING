name: Build and publish BREYDE TV SCREEN 2.9.35
# Build from the verified full source branch used by the working 2.9.29 / code 50 APK.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-breyde-remote.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de Breyde TV Screen"
        required: true
        default: "2.9.35"
      version_code:
        description: "Código interno monotónico; debe ser superior a 54"
        required: true
        default: "56"

permissions:
  contents: write

jobs:
  build:
    name: Build full TVScreen ${{ inputs.version || '2.9.35' }}
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Check private repository token
        env:
          TVSCREEN_REPO_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          if [ -z "$TVSCREEN_REPO_TOKEN" ]; then
            echo "::error::Falta el secreto TVSCREEN_REPO_TOKEN."
            exit 1
          fi

      - name: Checkout verified full TVScreen source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: feature/2.9.35-from-2.9.33-build55
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Verify full TVScreen source and required features
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          MAIN="tvbox-screen/app/src/main/java/com/breyde/tvscreen/MainActivity.java"
          SERVICE="tvbox-screen/app/src/main/java/com/breyde/tvscreen/ScreenCaptureService.java"
          UPDATER="tvbox-screen/app/src/main/java/com/breyde/tvscreen/UpdateJobService.java"
          MANIFEST="tvbox-screen/app/src/main/AndroidManifest.xml"
          test -s "$MAIN" && test -s "$SERVICE" && test -s "$UPDATER" && test -s "$MANIFEST"
          MAIN_LINES="$(wc -l < "$MAIN")"
          SERVICE_LINES="$(wc -l < "$SERVICE")"
          if [ "$MAIN_LINES" -lt 500 ] || [ "$SERVICE_LINES" -lt 500 ]; then
            echo "::error::Fuente antigua o incompleta; se cancela la compilación."
            exit 1
          fi
          for marker in "VOLVER A LA VERSIÓN ANTERIOR" "REINICIAR TV BOX" "BUSCAR ACTUALIZACIONES" "CONECTAR Y COMPARTIR PANTALLA" "ACTIVAR DETECCIÓN DE NAVEGADOR ABIERTO" "DETECCIÓN MULTIMEDIA"; do
            grep -Fq "$marker" "$MAIN" || { echo "::error::Falta función de interfaz: $marker"; exit 1; }
          done
          for marker in '"/api/apps"' '"/api/launch"' '"/api/status"' '"/api/media-activity"' '"/api/multi-audio-focus"' '"/api/reboot"' '"/api/install-apk"' '"/api/media-search"' 'spotify:search:'; do
            grep -Fq "$marker" "$SERVICE" || { echo "::error::Falta función remota: $marker"; exit 1; }
          done
          grep -Fq 'verifyRemoteBreydeAiApk(apk)' "$SERVICE"
          grep -Fq 'REMOTE_AI_PACKAGE="com.breyde.ai"' "$SERVICE"
          grep -Fq "MediaActivityListener.snapshot(this)" "$SERVICE"
          grep -Fq "CHECK UPDATE" "$MAIN"
          grep -Fq \"/api/mouse\" "$SERVICE"
          grep -Fq \"/api/adb/status\" "$SERVICE"
          grep -Fq 'case "tab"' "$SERVICE"
          grep -Fq 'case "space"' "$SERVICE"
          grep -Fq "releaseVersionCode" "$MAIN"
          grep -Fq "releaseVersionCode" "$UPDATER"
          grep -Fq 'if("2.9.30".equals(version)) return -1;' "$MAIN"
          grep -Fq 'if("2.9.30".equals(version)) return -1;' "$UPDATER"
          grep -Fq 'hasExtra("renameNode")' "$SERVICE"
          grep -Fq '"set-name".equals(type)' "$SERVICE"
          grep -Fq 'sharedName' "$SERVICE"
          grep -Fq 'GUARDAR NOMBRE EN BREYDE REMOTE' "$MAIN"
          grep -Fq 'sharedDeviceName' "$MAIN"
          grep -Fq 'versionCode 56' tvbox-screen/app/build.gradle
          grep -Fq "versionName '2.9.35'" tvbox-screen/app/build.gradle
          grep -Fq "am force-stop com.breyde.tvscreen" "$MAIN"
          grep -Fq "am force-stop com.breyde.tvscreen" "$UPDATER"
          grep -Fq "if(!ok) Log.w(TAG" "$UPDATER"
          grep -Fq "android:icon=\"@mipmap/ic_launcher\"" "$MANIFEST"
          echo "Fuente completa verificada: MainActivity $MAIN_LINES líneas; ScreenCaptureService $SERVICE_LINES líneas."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable APK signing key
        working-directory: private-source
        run: |
          mkdir -p tvbox-screen/signing
          base64 --decode tvbox-screen/signing/breyde-tv-release.keystore.b64 > tvbox-screen/signing/breyde-tv-release.keystore

      - name: Install Breyde launcher icon
        working-directory: private-source
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = Path("tvbox-screen/branding/breyde-remote-icon.png.b64")
          target = Path("tvbox-screen/app/src/main/res/mipmap-nodpi/ic_launcher.png")
          encoded = b"".join(source.read_bytes().split())
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(encoded + b"=" * (-len(encoded) % 4), validate=True))
          assert target.read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))
          assert target.stat().st_size > 8000, "El icono corporativo parece incompleto"
          print(f"Icono Breyde integrado: {target.stat().st_size} bytes")
          PY

      - name: Set requested monotonic version
        working-directory: private-source/tvbox-screen
        env:
          APP_VERSION: ${{ inputs.version || '2.9.35' }}
          APP_VERSION_CODE: ${{ inputs.version_code || '56' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["APP_VERSION"]
          code = int(os.environ["APP_VERSION_CODE"])
          if not re.fullmatch("[0-9]+[.][0-9]+[.][0-9]+", version):
              raise SystemExit("Versión semántica no válida")
          if code <= 54:
              raise SystemExit("Bloqueado: el versionCode debe ser superior a 53")
          p = Path("app/build.gradle")
          source = p.read_text()
          source = re.sub("versionCode[ ]+[0-9]+", "versionCode " + str(code), source, count=1)
          source = re.sub("versionName[ ]+'[^']+'", "versionName '" + version + "'", source, count=1)
          if "versionCode " + str(code) not in source or "versionName '" + version + "'" not in source:
              raise SystemExit("No se pudo fijar la versión solicitada")
          p.write_text(source)
          print("Compilando BREYDE TV SCREEN", version, "código", code)
          PY

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compile signed APK
        working-directory: private-source/tvbox-screen
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify package, version and signature
        env:
          APP_VERSION: ${{ inputs.version || '2.9.33' }}
          APP_VERSION_CODE: ${{ inputs.version_code || '56' }}
        run: |
          set -euo pipefail
          APK="private-source/tvbox-screen/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.breyde.tvscreen' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION'"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/breyde-tv-screen.apk
          sha256sum release/breyde-tv-screen.apk
          stat -c "APK size: %s bytes" release/breyde-tv-screen.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '2.9.35' }}
          name: BREYDE TV SCREEN v${{ inputs.version || '2.9.35' }}
          body: |
            VersionCode: ${{ inputs.version_code || '56' }}
            Base funcional: BREYDE TV SCREEN 2.9.33 (código 55), commit verificado.
            Fuente: feature/2.9.35-from-2.9.33-build55.
            Incluye sincronización bidireccional del nombre compartido entre la APK y BREYDE REMOTE, conservando el resto de funciones de la base.
            Incluye comprobación de actualización por versionCode, bloqueo de retrocesos, parada de procesos antes de instalar y búsqueda multimedia nativa.
            Instalación remota de BREYDE AI: subida desde móvil o selección desde Google Drive en el TV Box; verificación de paquete, firma y versión.
          generate_release_notes: true
          files: release/breyde-tv-screen.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
