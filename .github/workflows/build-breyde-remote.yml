name: Build Breyde Remote TVScreen APK (private source)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Breyde Remote 2.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check private repository token
        env:
          TVSCREEN_REPO_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          if [ -z "$TVSCREEN_REPO_TOKEN" ]; then
            echo "::error::Falta el secreto TVSCREEN_REPO_TOKEN en NEXT-WAVE-RISING."
            exit 1
          fi

      - name: Checkout private TVScreen source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: feature/tvscreen-root-dual-capture
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable APK signing key
        working-directory: private-source
        run: |
          mkdir -p tvbox-screen/signing
          base64 --decode tvbox-screen/signing/breyde-tv-release.keystore.b64 > tvbox-screen/signing/breyde-tv-release.keystore

      - name: Install Breyde Remote launcher icon
        working-directory: private-source
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = Path("tvbox-screen/branding/breyde-remote-icon.png.b64")
          target = Path("tvbox-screen/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")
          encoded = b"".join(source.read_bytes().split())
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(encoded + b"=" * (-len(encoded) % 4), validate=True))
          assert target.read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))
          PY

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compile Breyde Remote APK
        working-directory: private-source/tvbox-screen
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK="private-source/tvbox-screen/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Breyde Remote APK
        uses: actions/upload-artifact@v4
        with:
          name: breyde-remote-tvscreen-2.2.0-root-dual
          path: private-source/tvbox-screen/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
