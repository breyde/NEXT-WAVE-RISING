name: Build and publish Breyde TVScreen APK with Root capture, media panel and auto-reconnect

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-breyde-remote.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de Breyde TV Screen"
        required: true
        default: "2.9.24"
      version_code:
        description: "Código interno de versión (siempre mayor que el anterior)"
        required: true
        default: "46"

permissions:
  contents: write

jobs:
  build:
    name: Build TVScreen ${{ inputs.version || '2.9.24' }} retry
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Check private repository token
        env:
          TVSCREEN_REPO_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          if [ -z "$TVSCREEN_REPO_TOKEN" ]; then
            echo "::error::Falta el secreto TVSCREEN_REPO_TOKEN."
            exit 1
          fi

      - name: Checkout private TVScreen source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: feat/browser-media-detection
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Verify full and current TVScreen source
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH="feat/browser-media-detection"
          CHECKED_OUT="$(git rev-parse HEAD)"
          CHECKED_BRANCH="$(git branch --show-current)"
          echo "TVScreen source branch: $SOURCE_BRANCH"
          echo "Checked out branch: $CHECKED_BRANCH"
          echo "Checked out commit: $CHECKED_OUT"
          if [ "$CHECKED_BRANCH" != "$SOURCE_BRANCH" ]; then
            echo "::error::La APK no se compilará: se ha descargado una rama distinta de $SOURCE_BRANCH."
            exit 1
          fi
          MAIN="tvbox-screen/app/src/main/java/com/breyde/tvscreen/MainActivity.java"
          SERVICE="tvbox-screen/app/src/main/java/com/breyde/tvscreen/ScreenCaptureService.java"
          MEDIA="tvbox-screen/app/src/main/java/com/breyde/tvscreen/MediaActivityListener.java"
          test -s "$MAIN" && test -s "$SERVICE" && test -s "$MEDIA"
          MAIN_LINES="$(wc -l < "$MAIN")"
          SERVICE_LINES="$(wc -l < "$SERVICE")"
          if [ "$MAIN_LINES" -lt 400 ] || [ "$SERVICE_LINES" -lt 400 ]; then
            echo "::error::La APK no se compilará: los archivos principales parecen una versión antigua o incompleta."
            exit 1
          fi
          for marker in "VOLVER A LA VERSIÓN ANTERIOR" "REINICIAR TV BOX" "BUSCAR ACTUALIZACIONES" "CONECTAR Y COMPARTIR PANTALLA" "ACTIVAR DETECCIÓN DE NAVEGADOR ABIERTO" "DETECCIÓN MULTIMEDIA"; do
            grep -Fq "$marker" "$MAIN" || { echo "::error::Falta función de interfaz: $marker"; exit 1; }
          done
          for marker in "/api/apps" "/api/launch" "/api/status" "/api/media-activity" "/api/multi-audio-focus" "/api/reboot" "/api/install-apk"; do
            grep -Fq "$marker" "$SERVICE" || { echo "::error::Falta endpoint obligatorio: $marker"; exit 1; }
          done
          grep -Fq "MediaActivityListener.snapshot(this)" "$SERVICE"
          echo "Validación correcta: versión completa, funciones requeridas y último commit de la rama."
          echo "MainActivity: $MAIN_LINES líneas; ScreenCaptureService: $SERVICE_LINES líneas."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable APK signing key
        working-directory: private-source
        run: |
          mkdir -p tvbox-screen/signing
          base64 --decode tvbox-screen/signing/breyde-tv-release.keystore.b64 > tvbox-screen/signing/breyde-tv-release.keystore

      - name: Install Breyde Remote launcher icon
        working-directory: private-source
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = Path("tvbox-screen/branding/breyde-remote-icon.png.b64")
          target = Path("tvbox-screen/app/src/main/res/mipmap-nodpi/ic_launcher.png")
          encoded = b"".join(source.read_bytes().split())
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(encoded + b"=" * (-len(encoded) % 4), validate=True))
          assert target.read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))
          PY

      - name: Set requested version
        working-directory: private-source/tvbox-screen
        env:
          APP_VERSION: ${{ inputs.version || '2.9.24' }}
          APP_VERSION_CODE: ${{ inputs.version_code || '46' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+", "versionCode "+os.environ["APP_VERSION_CODE"], s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '"+os.environ["APP_VERSION"]+"'", s, count=1)
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compile signed APK
        working-directory: private-source/tvbox-screen
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK="private-source/tvbox-screen/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/breyde-tv-screen.apk
          sha256sum release/breyde-tv-screen.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '2.9.24' }}
          name: BREYDE TV SCREEN v${{ inputs.version || '2.9.24' }}
          generate_release_notes: true
          files: release/breyde-tv-screen.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
