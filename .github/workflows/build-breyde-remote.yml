name: Build and publish Breyde TVScreen APK 2.9.30 with dynamic app discovery
# Rebuild trigger: TVScreen source update on main.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-breyde-remote.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de Breyde TV Screen"
        required: true
        default: "2.9.30"
      version_code:
        description: "Código interno de versión (siempre mayor que el anterior)"
        required: true
        default: "52"

permissions:
  contents: write

jobs:
  build:
    name: Build TVScreen ${{ inputs.version || '2.9.30' }}
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Check private repository token
        env:
          TVSCREEN_REPO_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          if [ -z "$TVSCREEN_REPO_TOKEN" ]; then
            echo "::error::Falta el secreto TVSCREEN_REPO_TOKEN."
            exit 1
          fi

      - name: Checkout private TVScreen source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: main
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Verify current TVScreen app and dynamic package discovery
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          MAIN="tvbox-screen/app/src/main/java/com/breyde/tvscreen/MainActivity.java"
          SERVICE="tvbox-screen/app/src/main/java/com/breyde/tvscreen/ScreenCaptureService.java"
          MANIFEST="tvbox-screen/app/src/main/AndroidManifest.xml"
          test -s "$MAIN" && test -s "$SERVICE" && test -s "$MANIFEST"
          grep -Fq '"/api/apps"' "$SERVICE"
          grep -Fq '"/api/launch"' "$SERVICE"
          grep -Fq 'Intent.CATEGORY_LAUNCHER' "$SERVICE"
          grep -Fq 'Intent.CATEGORY_LEANBACK_LAUNCHER' "$SERVICE"
          grep -Fq 'queryIntentActivities' "$SERVICE"
          grep -Fq 'android.intent.category.LAUNCHER' "$MANIFEST"
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' "$MANIFEST"
          echo "Fuente actual verificada: catálogo dinámico de apps launcher y Android TV."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable APK signing key
        working-directory: private-source
        run: |
          mkdir -p tvbox-screen/signing
          base64 --decode tvbox-screen/signing/breyde-tv-release.keystore.b64 > tvbox-screen/signing/breyde-tv-release.keystore

      - name: Install Breyde Remote launcher icon
        working-directory: private-source
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = Path("tvbox-screen/branding/breyde-remote-icon.png.b64")
          target = Path("tvbox-screen/app/src/main/res/mipmap-nodpi/ic_launcher.png")
          encoded = b"".join(source.read_bytes().split())
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(base64.b64decode(encoded + b"=" * (-len(encoded) % 4), validate=True))
          assert target.read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))
          assert target.stat().st_size > 8000, "El icono del lanzador parece incompleto"
          print(f"Icono Breyde Remote integrado: {target.stat().st_size} bytes")
          PY

      - name: Set requested version
        working-directory: private-source/tvbox-screen
        env:
          APP_VERSION: ${{ inputs.version || '2.9.30' }}
          APP_VERSION_CODE: ${{ inputs.version_code || '52' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=re.sub(r"versionCode\s+\d+", "versionCode "+os.environ["APP_VERSION_CODE"], s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '"+os.environ["APP_VERSION"]+"'", s, count=1)
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compile signed APK
        working-directory: private-source/tvbox-screen
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK="private-source/tvbox-screen/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/breyde-tv-screen.apk
          sha256sum release/breyde-tv-screen.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '2.9.30' }}
          name: BREYDE TV SCREEN v${{ inputs.version || '2.9.30' }}
          generate_release_notes: true
          files: release/breyde-tv-screen.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
