# Build isolated BREYDE AI v0.1.29 with explicit Qwen-vs-system attribution and local conversation panel
name: Release BREYDE AI APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-breyde-ai.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Rama privada que se va a compilar"
        required: true
        default: "fix/breyde-ai-cumulative-recovery-20261125"
      version:
        description: "Versión de BREYDE AI"
        required: true
        default: "0.1.29"
      version_code:
        description: "Código interno de versión"
        required: true
        default: "31"

permissions:
  contents: write

jobs:
  release:
    name: Build and release BREYDE AI (multi-ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'fix/breyde-ai-cumulative-recovery-20261125' }}
      APP_VERSION: ${{ inputs.version || '0.1.29' }}
      APP_VERSION_CODE: ${{ inputs.version_code || '31' }}
    steps:
      - name: Check private repository token
        env:
          SOURCE_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Falta el secreto TVSCREEN_REPO_TOKEN."
            exit 1
          fi

      - name: Checkout BREYDE AI source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Verify isolated AI project
        working-directory: private-source
        run: |
          set -euo pipefail
          test -s breyde-ai/settings.gradle
          test -s breyde-ai/app/build.gradle
          test -s breyde-ai/app/src/main/AndroidManifest.xml
          test -s breyde-ai/app/src/main/java/com/breyde/ai/MainActivity.java
          grep -q "applicationId 'com.breyde.ai'" breyde-ai/app/build.gradle
          echo "Proyecto BREYDE AI verificado."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare dedicated BREYDE AI signing key
        env:
          BREYDE_AI_KEYSTORE_BASE64: ${{ secrets.BREYDE_AI_KEYSTORE_BASE64 }}
          BREYDE_AI_STORE_PASSWORD: ${{ secrets.BREYDE_AI_STORE_PASSWORD }}
          BREYDE_AI_KEY_ALIAS: ${{ secrets.BREYDE_AI_KEY_ALIAS }}
          BREYDE_AI_KEY_PASSWORD: ${{ secrets.BREYDE_AI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BREYDE_AI_KEYSTORE_BASE64 BREYDE_AI_STORE_PASSWORD BREYDE_AI_KEY_ALIAS BREYDE_AI_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name en NEXT-WAVE-RISING."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/breyde-ai-release.jks"
          printf '%s' "$BREYDE_AI_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "BREYDE_AI_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "BREYDE_AI_STORE_PASSWORD=$BREYDE_AI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BREYDE_AI_KEY_ALIAS=$BREYDE_AI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BREYDE_AI_KEY_PASSWORD=$BREYDE_AI_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$BREYDE_AI_STORE_PASSWORD" -alias "$BREYDE_AI_KEY_ALIAS" >/dev/null
          echo "Firma exclusiva de BREYDE AI verificada."

      - name: Set requested version
        working-directory: private-source/breyde-ai
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          s = re.sub(r"versionCode\s+\d+", "versionCode " + os.environ["APP_VERSION_CODE"], s, count=1)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '" + os.environ["APP_VERSION"] + "'", s, count=1)
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compile signed BREYDE AI APK
        working-directory: private-source/breyde-ai
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Verify signing certificate matches installed release lines
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/previous-apks"
          curl -fsSL "https://github.com/breyde/NEXT-WAVE-RISING/releases/download/breyde-ai-v0.1.10/breyde-ai.apk" -o "$RUNNER_TEMP/previous-apks/v0.1.10.apk"
          curl -fsSL "https://github.com/breyde/NEXT-WAVE-RISING/releases/download/breyde-ai-v0.1.11/breyde-ai.apk" -o "$RUNNER_TEMP/previous-apks/v0.1.11.apk"
          curl -fsSL "https://github.com/breyde/NEXT-WAVE-RISING/releases/download/breyde-ai-v0.1.22/breyde-ai.apk" -o "$RUNNER_TEMP/previous-apks/v0.1.22.apk"
          cert_digest() {
            "$TOOLS/apksigner" verify --print-certs "$1" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1 | tr 'A-F' 'a-f'
          }
          OLD_010="$(cert_digest "$RUNNER_TEMP/previous-apks/v0.1.10.apk")"
          OLD_011="$(cert_digest "$RUNNER_TEMP/previous-apks/v0.1.11.apk")"
          OLD_022="$(cert_digest "$RUNNER_TEMP/previous-apks/v0.1.22.apk")"
          NEW_CERT="$(cert_digest "private-source/breyde-ai/app/build/outputs/apk/release/app-release.apk")"
          test -n "$OLD_010" && test -n "$OLD_011" && test -n "$OLD_022" && test -n "$NEW_CERT"
          echo "Comparando huellas SHA-256 de certificados (sin mostrar claves privadas)."
          if [ "$OLD_010" != "$OLD_011" ] || [ "$OLD_010" != "$OLD_022" ] || [ "$OLD_022" != "$NEW_CERT" ]; then
            echo "::error::El certificado nuevo no coincide con las versiones anteriores. Se bloquea la publicación para proteger la instalación y sus datos."
            exit 1
          fi
          echo "Certificado compatible con 0.1.10, 0.1.11 y 0.1.22."

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="private-source/breyde-ai/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.breyde.ai'|versionCode='$APP_VERSION_CODE'|versionName='$APP_VERSION'"
          mkdir -p release
          cp "$APK" release/breyde-ai.apk
          sha256sum release/breyde-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: breyde-ai-v${{ env.APP_VERSION }}
          name: BREYDE AI v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: release/breyde-ai.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
