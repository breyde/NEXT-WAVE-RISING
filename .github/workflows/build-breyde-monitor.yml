name: Build and publish BREYDE Monitor
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-breyde-monitor.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Rama privada de BREYDE Monitor"
        required: true
        default: "feature/monitor-app-dashboard-20261127"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'feature/monitor-app-dashboard-20261127' }}
    steps:
      - name: Check private source token
        env:
          SOURCE_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Falta el secreto TVSCREEN_REPO_TOKEN."
            exit 1
          fi
      - name: Checkout private BREYDE Monitor source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Verify isolated Monitor project
        working-directory: private-source
        run: |
          set -euo pipefail
          test -s monitor-app/settings.gradle
          test -s monitor-app/app/build.gradle
          test -s monitor-app/app/src/main/AndroidManifest.xml
          test -s monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -q "applicationId 'com.breyde.monitor'" monitor-app/app/build.gradle
          grep -Fq 'GET /api/media-activity' server.js
          echo "Proyecto BREYDE Monitor y puente multimedia verificados."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
      - name: Compile BREYDE Monitor APK
        working-directory: private-source/monitor-app
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/monitor-build.log"
          result=${PIPESTATUS[0]}
          exit "$result"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breyde-monitor-build-diagnostics
          path: monitor-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify APK identity and checksum
        run: |
          set -euo pipefail
          APK="private-source/monitor-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.breyde.monitor' versionCode='1' versionName='1.0.0'"
          mkdir -p release
          cp "$APK" release/breyde-monitor.apk
          sha256sum release/breyde-monitor.apk | tee release/SHA256SUMS.txt
      - name: Publish BREYDE Monitor release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: breyde-monitor-v1.0.0
          name: BREYDE MONITOR v1.0.0
          body: |
            Primera versión de la aplicación monitorizadora BREYDE.
            Base de integración: BREYDE TV SCREEN 2.9.33 y BREYDE REMOTE.
            Incluye panel multidispositivo, actividad multimedia y visualización/tacto remoto de pantalla.
          files: |
            release/breyde-monitor.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Trigger build with latest BREYDE Monitor integration updates.

# Rebuild with foreground notifications and per-TVBox configuration.
