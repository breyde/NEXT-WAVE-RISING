name: Build and publish BREYDE Monitor
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-breyde-monitor.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Rama privada de BREYDE Monitor"
        required: true
        default: "feature/monitor-app-dashboard-20261127"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'feature/monitor-app-dashboard-20261127' }}
    steps:
      - name: Check private-source token
        env:
          SOURCE_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "::error::Falta TVSCREEN_REPO_TOKEN"; exit 1; }
      - name: Checkout private BREYDE source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Restore existing BREYDE SCREEN signing key for Monitor
        working-directory: private-source
        run: |
          set -euo pipefail
          mkdir -p tvbox-screen/signing
          base64 --decode tvbox-screen/signing/breyde-tv-release.keystore.b64 > tvbox-screen/signing/breyde-tv-release.keystore
          test -s tvbox-screen/signing/breyde-tv-release.keystore
          chmod 600 tvbox-screen/signing/breyde-tv-release.keystore
          echo "Existing BREYDE SCREEN keystore restored for the Monitor release build."
      - name: Verify isolated Monitor project
        working-directory: private-source
        run: |
          set -euo pipefail
          test -s monitor-app/settings.gradle
          test -s monitor-app/app/build.gradle
          test -s monitor-app/app/src/main/AndroidManifest.xml
          test -s monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          test -s tvbox-screen/app/build.gradle
          grep -q "applicationId 'com.breyde.monitor'" monitor-app/app/build.gradle
          grep -Fq '/api/remote/status' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'optJSONArray("devices")' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'deviceId' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'POST","/api/media-activity' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'new BreydeIconView(this,"breyde",48)' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'private String[] platformMeta' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'head.setOnClickListener(v->showCapture.run());' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'IPv4 · ' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'if(meta==null)continue;' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'if(!isConfigured(n,app[1]))continue;' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'icon.setActiveDot(active);' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'c.drawCircle(cx,cy,r,p);' monitor-app/app/src/main/java/com/breyde/monitor/BreydeIconView.java
          grep -Fq '/api/stream-mode' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq '/api/remote/device-name' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'ESPERANDO NUEVA IMAGEN' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          test -s monitor-app/app/src/main/java/com/breyde/monitor/BreydeIconView.java
          test -s monitor-app/app/src/main/java/com/breyde/monitor/SecureCredentials.java
          grep -Fq 'SecureCredentials.save(this,u,p)' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'setRequestProperty("Authorization",authorization())' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'setRequestProperty("Authorization",authorization())' monitor-app/app/src/main/java/com/breyde/monitor/MonitorService.java
          grep -q "versionCode 11" monitor-app/app/build.gradle
          grep -q "versionName '1.0.10'" monitor-app/app/build.gradle
          grep -q "breyde-tv-release.keystore" monitor-app/app/build.gradle
          echo "Monitor identity, API bridge and shared signing source verified. Build config reads SCREEN signing values locally."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
      - name: Build signed BREYDE Monitor release APK
        working-directory: private-source/monitor-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/monitor-build.log"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breyde-monitor-build-diagnostics
          path: monitor-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify signed APK identity and checksum
        run: |
          set -euo pipefail
          APK="private-source/monitor-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.breyde.monitor' versionCode='11' versionName='1.0.10'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          mkdir -p release
          cp "$APK" release/breyde-monitor.apk
          sha256sum release/breyde-monitor.apk | tee release/SHA256SUMS.txt
      - name: Checkout BREYDE TV SCREEN main source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: main
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-screen
          persist-credentials: false
      - name: Restore existing BREYDE SCREEN signing key
        working-directory: private-screen
        run: |
          set -euo pipefail
          mkdir -p tvbox-screen/signing
          base64 --decode tvbox-screen/signing/breyde-tv-release.keystore.b64 > tvbox-screen/signing/breyde-tv-release.keystore
          test -s tvbox-screen/signing/breyde-tv-release.keystore
          chmod 600 tvbox-screen/signing/breyde-tv-release.keystore
      - name: Confirm TV Screen launcher resource fix
        run: test -s private-screen/tvbox-screen/app/src/main/res/drawable/breyde_launcher.xml
      - name: Build signed BREYDE TV SCREEN release APK
        working-directory: private-screen/tvbox-screen
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/screen-build.log"
      - name: Verify signed TV SCREEN APK
        run: |
          set -euo pipefail
          APK="private-screen/tvbox-screen/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.breyde.tvscreen' versionCode='54' versionName='2.9.34'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" release/breyde-tv-screen.apk
          sha256sum release/breyde-tv-screen.apk | tee release/TVSCREEN-SHA256SUMS.txt
      - name: Publish BREYDE Monitor release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: breyde-monitor-v1.0.10
          name: BREYDE MONITOR v1.0.10
          body: |
            Versión 1.0.10 firmada con el mismo certificado estable de BREYDE SCREEN.
            Nombres compartidos con BREYDE REMOTE y BREYDE SCREEN; recuperación de captura sin confundir una pausa temporal con desconexión.
            Conserva el paquete com.breyde.monitor y los datos locales al actualizar.
            Iconos de plataformas configuradas visibles aunque el TVBox esté offline, con punto verde/gris de estado, orla dorada Premium e iconos circulares compactos. Se conserva la IP pública IPv4, captura directa al tocar el TVBox, autenticación cifrada con Android Keystore y firma compartida de BREYDE SCREEN.
          files: |
            release/breyde-monitor.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish BREYDE TV SCREEN release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: breyde-tv-screen-v2.9.34
          name: BREYDE TV SCREEN v2.9.34
          body: |
            BREYDE SCREEN con sincronización de nombre compartido.
            Los nombres modificados desde REMOTE o MONITOR se guardan en el TV Box y se restauran al reconectar.
            Mantiene el paquete com.breyde.tvscreen y la firma estable existente.
          files: |
            release/breyde-tv-screen.apk
            release/TVSCREEN-SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
