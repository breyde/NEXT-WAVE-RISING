name: Build and publish BREYDE Monitor
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-breyde-monitor.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Rama privada de BREYDE Monitor"
        required: true
        default: "feature/monitor-app-dashboard-20261127"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'feature/monitor-app-dashboard-20261127' }}
    steps:
      - name: Check private-source token
        env:
          SOURCE_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "::error::Falta TVSCREEN_REPO_TOKEN"; exit 1; }
      - name: Checkout private BREYDE source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Restore existing BREYDE SCREEN signing key for Monitor
        working-directory: private-source
        run: |
          set -euo pipefail
          mkdir -p tvbox-screen/signing
          base64 --decode tvbox-screen/signing/breyde-tv-release.keystore.b64 > tvbox-screen/signing/breyde-tv-release.keystore
          test -s tvbox-screen/signing/breyde-tv-release.keystore
          chmod 600 tvbox-screen/signing/breyde-tv-release.keystore
          echo "Existing BREYDE SCREEN keystore restored for the Monitor release build."
      - name: Verify isolated Monitor project
        working-directory: private-source
        run: |
          set -euo pipefail
          test -s monitor-app/settings.gradle
          test -s monitor-app/app/build.gradle
          test -s monitor-app/app/src/main/AndroidManifest.xml
          test -s monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          test -s tvbox-screen/app/build.gradle
          grep -q "applicationId 'com.breyde.monitor'" monitor-app/app/build.gradle
          grep -Fq '/api/remote/status' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'optJSONArray("devices")' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'deviceId' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'POST","/api/media-activity' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -Fq 'import android.widget.HorizontalScrollView;' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -q "versionCode 7" monitor-app/app/build.gradle
          grep -q "versionName '1.0.6'" monitor-app/app/build.gradle
          grep -q "breyde-tv-release.keystore" monitor-app/app/build.gradle
          echo "Monitor identity, API bridge and shared signing source verified. Build config reads SCREEN signing values locally."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
      - name: Build signed BREYDE Monitor release APK
        working-directory: private-source/monitor-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/monitor-build.log"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breyde-monitor-build-diagnostics
          path: monitor-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify signed APK identity and checksum
        run: |
          set -euo pipefail
          APK="private-source/monitor-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.breyde.monitor' versionCode='7' versionName='1.0.6'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          mkdir -p release
          cp "$APK" release/breyde-monitor.apk
          sha256sum release/breyde-monitor.apk | tee release/SHA256SUMS.txt
      - name: Publish BREYDE Monitor release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: breyde-monitor-v1.0.6
          name: BREYDE MONITOR v1.0.6
          body: |
            Versión 1.0.6 firmada con el mismo certificado estable de BREYDE SCREEN.
            Conserva el paquete com.breyde.monitor y los datos locales al actualizar.
            Contrato correcto de BREYDE REMOTE: GET /api/remote/status, devices, deviceId y POST /api/remote/request para POST /api/media-activity. Interfaz visual según referencia del usuario.
          files: |
            release/breyde-monitor.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
