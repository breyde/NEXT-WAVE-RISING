name: Build and publish BREYDE Monitor
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-breyde-monitor.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Rama privada de BREYDE Monitor"
        required: true
        default: "feature/monitor-app-dashboard-20261127"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'feature/monitor-app-dashboard-20261127' }}
    steps:
      - name: Check private-source token
        env:
          SOURCE_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "::error::Falta TVSCREEN_REPO_TOKEN"; exit 1; }
      - name: Checkout private BREYDE source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Reuse the exact BREYDE SCREEN release signing key
        working-directory: private-source
        run: |
          set -euo pipefail
          KEY_B64="tvbox-screen/signing/breyde-tv-release.keystore.b64"
          SCREEN_GRADLE="tvbox-screen/app/build.gradle"
          test -s "$KEY_B64"
          test -s "$SCREEN_GRADLE"
          KEYSTORE="$RUNNER_TEMP/breyde-tv-release.keystore"
          base64 --decode "$KEY_B64" > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          python3 - "$SCREEN_GRADLE" "$KEYSTORE" "$GITHUB_ENV" <<'PY'
          import re, sys
          from pathlib import Path
          gradle_path, keystore_path, env_path = sys.argv[1:]
          source = Path(gradle_path).read_text()
          def extract(name):
              match = re.search(r"\\b" + name + r"\\s+'([^']+)'", source)
              if not match:
                  raise SystemExit("No se pudo leer la configuración de firma estable de BREYDE SCREEN")
              return match.group(1)
          values = {
              "MONITOR_KEYSTORE_FILE": keystore_path,
              "MONITOR_KEYSTORE_PASSWORD": extract("storePassword"),
              "MONITOR_KEY_ALIAS": extract("keyAlias"),
              "MONITOR_KEY_PASSWORD": extract("keyPassword"),
          }
          with open(env_path, "a") as out:
              for key, value in values.items():
                  out.write(f"{key}={value}\\n")
          PY
          keytool -list -keystore "$KEYSTORE" -storepass "$MONITOR_KEYSTORE_PASSWORD" -alias "$MONITOR_KEY_ALIAS" >/dev/null
          echo "Clave estable compartida de BREYDE SCREEN verificada; no se ha creado ni duplicado otra firma."
      - name: Verify isolated Monitor project
        working-directory: private-source
        run: |
          set -euo pipefail
          test -s monitor-app/settings.gradle
          test -s monitor-app/app/build.gradle
          test -s monitor-app/app/src/main/AndroidManifest.xml
          test -s monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -q "applicationId 'com.breyde.monitor'" monitor-app/app/build.gradle
          grep -Fq '/api/remote/status' monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          grep -q "versionCode 5" monitor-app/app/build.gradle
          grep -q "versionName '1.0.4'" monitor-app/app/build.gradle
          echo "Proyecto BREYDE Monitor y puente multimedia verificados."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
      - name: Build signed BREYDE Monitor release APK
        working-directory: private-source/monitor-app
        run: |
          set +e
          gradle --no-daemon :app:assembleRelease --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/monitor-build.log"
          result=${PIPESTATUS[0]}
          exit "$result"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breyde-monitor-build-diagnostics
          path: monitor-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify signed APK identity and checksum
        run: |
          set -euo pipefail
          APK="private-source/monitor-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.breyde.monitor' versionCode='5' versionName='1.0.4'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          mkdir -p release
          cp "$APK" release/breyde-monitor.apk
          sha256sum release/breyde-monitor.apk | tee release/SHA256SUMS.txt
      - name: Publish BREYDE Monitor release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: breyde-monitor-v1.0.4
          name: BREYDE MONITOR v1.0.4
          body: |
            Versión 1.0.4: firmada con el mismo certificado estable de BREYDE SCREEN para permitir actualizaciones futuras.
            Conserva el paquete com.breyde.monitor y los datos locales de la aplicación.
            Base de integración: BREYDE TV SCREEN 2.9.33 y BREYDE REMOTE.
          files: |
            release/breyde-monitor.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
