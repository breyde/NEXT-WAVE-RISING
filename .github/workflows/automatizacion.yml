name: Next Wave Rising - Automatizacion

on:
  # Los dos horarios UTC cubren el cambio horario de Espana.
  # El script comprueba siempre la hora local Europe/Madrid antes de actuar.
  schedule:
    - cron: "0 20,21 * * 4"
    - cron: "59 21,22 * * 4"
    - cron: "0 22,23 * * 4"
  workflow_dispatch:
    inputs:
      publish_targets:
        description: "Playlist pública que se actualizará después de refrescar las copias temporales"
        required: false
        type: choice
        options:
          - none
          - weekly
          - monthly
          - annual
          - all
        default: none
      temp_sync_targets:
        description: "Copias temporales que se actualizarán manualmente"
        required: false
        type: choice
        options:
          - none
          - weekly
          - monthly
          - annual
          - all
        default: none
      manual_list_action:
        description: "Rotación manual de las listas internas de Firebase"
        required: false
        type: choice
        options:
          - none
          - active_to_monthly
          - queue_to_active
          - featured_to_queue
        default: none

permissions:
  contents: read

concurrency:
  group: next-wave-rising-rotation
  cancel-in-progress: false

jobs:
  automatizacion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SPOTIFY_CLIENT_ID: "0525688e1d0a4d0fa7ebf8b44e94be61"
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Comprobar configuracion segura
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT."
          echo "Añadelo en Settings > Secrets and variables > Actions."
          echo "La ejecucion queda omitida hasta configurar Firebase."

      - name: Verificar destino de Firebase sin revelar credenciales
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          node - <<'NODE'
          const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          const actual = String(account.project_id || '');
          const expected = 'pruebas-73346';
          console.log('Proyecto Firebase del secreto: ' + (actual || 'SIN project_id'));
          console.log('Proyecto Firebase de la web: ' + expected);
          if (actual !== expected) {
            console.error('ERROR: FIREBASE_SERVICE_ACCOUNT apunta a otro proyecto. No se ejecutarán rotaciones.');
            process.exit(1);
          }
          console.log('Correcto: GitHub Actions y la web apuntan al mismo proyecto.');
          NODE

      - name: Instalar dependencias
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm install --omit=dev

      - name: Ejecutar automatizacion
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run automation

      - name: Rotar listas internas manualmente en Firebase
        if: github.event_name == 'workflow_dispatch' && inputs.manual_list_action != 'none' && env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          MANUAL_LIST_ACTION: ${{ inputs.manual_list_action }}
        run: npm run manual-list-rotation

      - name: Sincronizar playlists privadas de Spotify
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.temp_sync_targets != 'none' || inputs.publish_targets != 'none'))) && env.FIREBASE_SERVICE_ACCOUNT != '' && env.SPOTIFY_REFRESH_TOKEN != ''
        env:
          SYNC_TARGETS: ${{ inputs.temp_sync_targets }}
          PUBLISH_TARGETS: ${{ inputs.publish_targets }}
        run: npm run spotify-sync

      - name: Publicar en playlists publicas por solicitud manual
        if: github.event_name == 'workflow_dispatch' && inputs.publish_targets != 'none' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.SPOTIFY_REFRESH_TOKEN != ''
        env:
          PUBLISH_TARGETS: ${{ inputs.publish_targets }}
        run: npm run spotify-publish

      - name: Comprobar publicacion automatica programada
        if: github.event_name == 'schedule' && env.FIREBASE_SERVICE_ACCOUNT != '' && env.SPOTIFY_REFRESH_TOKEN != ''
        run: npm run spotify-auto-publish
