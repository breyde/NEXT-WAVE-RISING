name: Build BREYDE REMOTE Android Client

on:
  push:
    paths:
      - '.github/workflows/build-breyde-remote-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check private repository token
        env:
          TVSCREEN_REPO_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          test -n "$TVSCREEN_REPO_TOKEN" || { echo "::error::Missing TVSCREEN_REPO_TOKEN"; exit 1; }

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: feature/tvscreen-root-dual-capture
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compile client APK
        working-directory: source/client-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK="source/client-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload client APK
        uses: actions/upload-artifact@v4
        with:
          name: breyde-remote-android-client-1.0.0
          path: source/client-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
