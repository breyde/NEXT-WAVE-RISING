name: Build and publish BREYDE Monitor 1.0.18
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-breyde-monitor-1.0.18.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Rama privada de BREYDE Monitor"
        required: true
        default: "feature/monitor-responsive-mouse-ai-1.0.18-20261128"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'feature/monitor-responsive-mouse-ai-1.0.18-20261128' }}
    steps:
      - name: Validate private source token
        env:
          SOURCE_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "::error::Falta TVSCREEN_REPO_TOKEN"; exit 1; }
      - name: Checkout private BREYDE source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Restore shared stable signing key
        working-directory: private-source
        run: |
          set -euo pipefail
          mkdir -p tvbox-screen/signing
          base64 --decode tvbox-screen/signing/breyde-tv-release.keystore.b64 > tvbox-screen/signing/breyde-tv-release.keystore
          test -s tvbox-screen/signing/breyde-tv-release.keystore
          chmod 600 tvbox-screen/signing/breyde-tv-release.keystore
      - name: Verify Monitor 1.0.18 source
        working-directory: private-source
        run: |
          set -euo pipefail
          test -s monitor-app/settings.gradle
          test -s monitor-app/app/build.gradle
          test -s monitor-app/app/src/main/AndroidManifest.xml
          MAIN=monitor-app/app/src/main/java/com/breyde/monitor/MainActivity.java
          test -s "$MAIN"
          grep -q "applicationId 'com.breyde.monitor'" monitor-app/app/build.gradle
          grep -q "versionCode 19" monitor-app/app/build.gradle
          grep -q "versionName '1.0.18'" monitor-app/app/build.gradle
          grep -Fq 'private final ExecutorService streamIo' "$MAIN"
          grep -Fq 'private final ExecutorService controlIo' "$MAIN"
          grep -Fq 'RATÓN: ACTIVADO' "$MAIN"
          grep -Fq 'put("nodeId",node.id)' "$MAIN"
          grep -Fq 'api/remote/agent' "$MAIN"
          test -s tvbox-screen/signing/breyde-tv-release.keystore
          echo "Monitor 1.0.18 source, stream/control separation, pointer controls, AI payload and signing material verified."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
      - name: Build signed BREYDE Monitor APK
        working-directory: private-source/monitor-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/monitor-build.log"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breyde-monitor-1.0.18-build-diagnostics
          path: monitor-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify APK identity, signature and checksum
        run: |
          set -euo pipefail
          APK="private-source/monitor-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.breyde.monitor' versionCode='19' versionName='1.0.18'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signing-certificate.txt
          mkdir -p release
          cp "$APK" release/breyde-monitor.apk
          sha256sum release/breyde-monitor.apk | tee release/SHA256SUMS.txt
      - name: Publish BREYDE Monitor 1.0.18
        uses: softprops/action-gh-release@v2
        with:
          tag_name: breyde-monitor-v1.0.18
          name: BREYDE MONITOR v1.0.18
          body: |
            Optimización de respuesta: transmisión de pantalla aislada de la cola de controles.
            Mando, toques, cambios de resolución y órdenes IA ya no esperan a la descarga de cada fotograma.
            Ratón activable en la pantalla desplegada, con cursor móvil y botón de clic separado.
            Corregida la petición de BREYDE IA para enviar nodeId en el cuerpo como hace la web.
            Mantiene com.breyde.monitor, firma estable y datos de la instalación anterior.
          files: |
            release/breyde-monitor.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
