name: Build BREYDE AI Local Core (validation)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-breyde-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate BREYDE AI local engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check private repository token
        env:
          SOURCE_TOKEN: ${{ secrets.TVSCREEN_REPO_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Falta el secreto TVSCREEN_REPO_TOKEN."
            exit 1
          fi

      - name: Checkout BREYDE AI local-core source
        uses: actions/checkout@v4
        with:
          repository: breyde/BREYDE-VIDEO-STUDIO
          ref: feature/breyde-ai-local-core
          token: ${{ secrets.TVSCREEN_REPO_TOKEN }}
          path: private-source
          persist-credentials: false

      - name: Verify isolated AI project and local runtime
        working-directory: private-source
        run: |
          set -euo pipefail
          test -s breyde-ai/settings.gradle
          test -s breyde-ai/app/build.gradle
          test -s breyde-ai/app/src/main/AndroidManifest.xml
          test -s breyde-ai/app/src/main/java/com/breyde/ai/MainActivity.java
          test -s breyde-ai/app/src/main/java/com/breyde/ai/LocalAiEngine.java
          test -s breyde-ai/app/src/main/cpp/CMakeLists.txt
          test -s breyde-ai/app/src/main/cpp/local_ai_jni.cpp
          grep -q "applicationId 'com.breyde.ai'" breyde-ai/app/build.gradle
          grep -q "versionName '0.1.12'" breyde-ai/app/build.gradle
          grep -q "versionCode 14" breyde-ai/app/build.gradle
          echo "Proyecto independiente y runtime local verificados."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compile BREYDE AI debug APK
        working-directory: private-source/breyde-ai
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK identity
        run: |
          set -euo pipefail
          APK="private-source/breyde-ai/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.breyde.ai'|versionCode='14'|versionName='0.1.12'"
          mkdir -p release
          cp "$APK" release/breyde-ai-local-core-debug.apk
          sha256sum release/breyde-ai-local-core-debug.apk

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: breyde-ai-local-core-debug
          path: release/breyde-ai-local-core-debug.apk
          if-no-files-found: error
          retention-days: 14
