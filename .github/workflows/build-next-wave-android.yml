name: Build Next Wave Rising Android APK

on:
  push:
    branches:
      - test-next-wave-android-apk
    paths:
      - 'android-app/**'
      - '.github/workflows/build-next-wave-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-wave-android-test
  cancel-in-progress: true

jobs:
  build:
    name: Build WebView APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: next-wave-rising-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
